id: assistant-acceptable-variation
subject: assistant
objective: >-
  Evaluate three controlled response variants of the same question and context.
  The variants differ in wording, structure, and level of detail but keep the
  same grounded facts, so all of them must pass the same criteria; this
  distinguishes acceptable wording variation from a meaningful failure.
input: What is the current stock level for Lab Notebook?
context:
  documents:
    - "Lab Notebook: 42 units in stock. Reorder threshold is 10 units."
    - "Lab Pen: 120 units in stock. Reorder threshold is 25 units."
  systemInstructions: >-
    Answer only using the provided documents. Do not invent stock levels.
responseVariants:
  - variantRef: concise
    response: The Lab Notebook has 42 units in stock.
  - variantRef: detailed
    response: >-
      The Lab Notebook has 42 units in stock, which is above the reorder
      threshold of 10 units.
  - variantRef: reordered
    response: >-
      Currently in stock: Lab Notebook with 42 units remaining (reorder
      threshold 10 units).
expectedProperties:
  - dimension: groundedness
    property: The grounded stock facts are preserved in every wording variant.
    mustContain: ["42 units"]
    mustNotContain: ["420 units", "out of stock"]
  - dimension: acceptable-nondeterministic-variation
    property: Wording, structure, and detail vary while the behavioral property still holds.
    mustContain: ["42 units"]
    mustNotContain: ["420 units"]
mode: deterministic
dimensions: [groundedness, acceptable-nondeterministic-variation]
severity: medium
tags: [variation, deterministic]
